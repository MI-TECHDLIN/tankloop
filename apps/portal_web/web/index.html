<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TankLoop Verify: dated, evidence-limited water-point records and open concerns. Demo records are explicitly simulated.">
  <meta name="theme-color" content="#0F766E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; background: #edf6f5; }
    #record-startup { box-sizing: border-box; max-width: 640px; margin: 0 auto; padding: 32px 20px; color: #102a43; font: 16px/1.5 system-ui, sans-serif; }
    .startup-brand { font-size: 24px; font-weight: 800; }
    .startup-card { background: #ffffffc4; border: 1px solid white; border-radius: 28px; margin-top: 24px; padding: 24px; }
    .startup-skeleton { height: 16px; border-radius: 10px; margin: 16px 0; background: linear-gradient(100deg, #dce7e7, #f6f8fa, #dce7e7); background-size: 200% 100%; animation: skeleton 1.4s linear infinite; }
    .startup-skeleton:first-child { height: 28px; width: 65%; }
    @keyframes skeleton { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .startup-skeleton { animation: none; } }
    .text-first .startup-card { display: none; }
    html.text-first, .text-first body { background: white; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TankLoop Verify">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TankLoop Verify</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="record-startup" role="status" aria-live="polite">
    <div class="startup-brand">tankloop</div>
    <p id="startup-status">Loading the record viewer...</p>
    <div class="startup-card" aria-hidden="true"><div class="startup-skeleton"></div><div class="startup-skeleton"></div><div class="startup-skeleton"></div></div>
  </div>
  <noscript>JavaScript is needed to open this point record. No current water-quality claim can be made from an unloaded page.</noscript>
  <script>
    if (new URLSearchParams(location.hash.split('?')[1]).get('view') === 'text') {
      document.documentElement.classList.add('text-first');
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
