name: tankloop_design_system
publish_to: none
resolution: workspace
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  tankloop_domain: any
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 700
